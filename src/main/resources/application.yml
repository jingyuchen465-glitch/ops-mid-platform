  datasource:
    url: jdbc:mysql://mysql-02a756b9c0e4-public.rds.volces.com:3306/bear-mcp-single?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root

server:
  port: 8090

spring:
  application:
    name: bear-mcp-single
  datasource:
    url: ${BEAR_DB_URL:jdbc:mysql://127.0.0.1:3306/bear-mcp-single?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${BEAR_DB_USERNAME:root}
    password: ${BEAR_DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${BEAR_REDIS_HOST:127.0.0.1}
      port: ${BEAR_REDIS_PORT:6379}
      username: ${BEAR_REDIS_USERNAME:}
      password: ${BEAR_REDIS_PASSWORD:}
      database: ${BEAR_REDIS_DATABASE:0}
      timeout: ${BEAR_REDIS_TIMEOUT:3s}
  sql:
    init:
      mode: never
  ai:
    mcp:
      server:
        version: 0.1.0
        protocol: STREAMABLE

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: INFO
    com.bear.mcp.single: DEBUG
    com.bear.mcp.single.core.mapper: WARN
    org.mybatis: WARN
    org.springframework.ai.mcp: INFO

bear:
  admin:
    # 管理端 JWT 签名密钥：生产必须通过环境变量 BEAR_ADMIN_JWT_SECRET 注入强随机密钥。
    # 默认值仅用于本地开发，绝不可用于生产。
    jwt-secret: ${BEAR_ADMIN_JWT_SECRET:dev-only-insecure-secret-key-2026-change-me-in-prod}
    # 数据加密密钥（Token 明文 / 数据源密码 AES 加密）独立于 JWT 签名密钥。
    # 不设置时回落到 jwt-secret，生产建议单独配置 BEAR_ADMIN_DATA_SECRET。
    data-secret: ${BEAR_ADMIN_DATA_SECRET:}
    jwt-expire-seconds: 7200
  mcp:
    demo-token: mcp_dev_token
  storage:
    tos:
      endpoint: ${BEAR_TOS_ENDPOINT:tos-cn-shanghai.volces.com}
      region: ${BEAR_TOS_REGION:cn-shanghai}
      bucket: ${BEAR_TOS_BUCKET:yq-admin-11-dev}
      access-key: ${BEAR_TOS_ACCESS_KEY:}
      secret-key: ${BEAR_TOS_SECRET_KEY:}
      upload-expire-seconds: ${BEAR_TOS_UPLOAD_EXPIRE_SECONDS:600}
